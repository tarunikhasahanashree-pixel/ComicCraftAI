<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft AI</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-8 space-y-6">
        <form action="/generate" method="POST" class="space-y-5">
            
            <!-- Story Prompt -->
            <div>
                <label for="story_prompt" class="block text-gray-900 font-bold mb-2">Story Prompt</label>
                <textarea 
                    id="story_prompt" 
                    name="story_prompt" 
                    rows="4" 
                    placeholder="Enter your comic story..." 
                    class="w-full border border-gray-300 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-y"
                    required></textarea>
            </div>

            <!-- Character Name -->
            <div>
                <label for="character_name" class="block text-gray-900 font-bold mb-2">Character Name</label>
                <input 
                    type="text" 
                    id="character_name" 
                    name="character_name" 
                    placeholder="Example: Arjun" 
                    class="w-full border border-gray-300 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            </div>

            <!-- Setting -->
            <div>
                <label for="setting" class="block text-gray-900 font-bold mb-2">Setting</label>
                <input 
                    type="text" 
                    id="setting" 
                    name="setting" 
                    placeholder="Example: Magical Forest" 
                    class="w-full border border-gray-300 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            </div>

            <!-- Story Tone -->
<div>
    <label for="tone" class="block text-gray-900 font-bold mb-2">Story Tone</label>
    <select 
        id="tone" 
        name="tone" 
        class="w-full border border-gray-300 rounded-lg p-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
        <option value="Adventure" selected>Adventure</option>
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Dark">Dark</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Fantasy">Fantasy</option>
    </select>
</div>
            <!-- Art Style -->
            <div>
                <label for="art_style" class="block text-gray-900 font-bold mb-2">Art Style</label>
                <select 
                    id="art_style" 
                    name="art_style" 
                    class="w-full border border-gray-300 rounded-lg p-3 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    <option value="Comic Book" selected>Comic Book</option>
                    <option value="Anime / Manga">Anime / Manga</option>
                    <option value="Watercolor">Watercolor</option>
                    <option value="3D Render">3D Render</option>
                    <option value="Pixel Art">Pixel Art</option>
                </select>
            </div>

            <!-- Generate Button -->
            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow transition duration-200 ease-in-out text-center">
                    Generate Comic
                </button>
            </div>

        </form>

        <!-- Output section (Displays generated response) -->
        {% if result %}
        <div class="mt-8 p-4 bg-green-50 border border-green-200 rounded-lg">
            <h3 class="text-lg font-bold text-green-800">{{ result.status }}</h3>
            <p class="text-sm text-green-700 mt-1">Prompt: {{ result.story_prompt }}</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
